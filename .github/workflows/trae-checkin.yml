name: Trae 签到

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    name: 执行签到
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 查询并领取
        env:
          TRAE_TOKEN: ${{ secrets.TRAE_TOKEN }}
        run: |
          if [ -z "$TRAE_TOKEN" ]; then
            echo "::error::缺少 TRAE_TOKEN"
            exit 1
          fi
          cat > /tmp/trae_checkin.js <<'JS'
          const headers = {
            'Authorization': 'Cloud-IDE-JWT ' + process.env.TRAE_TOKEN,
            'Content-Type': 'application/json',
            'X-User-Region': 'CN',
          };
          const STATUS = 'https://api.trae.cn/trae/api/v2/ug/checkin_credits/status';
          const CLAIM = 'https://api.trae.cn/trae/api/v2/ug/checkin_credits/claim';

          async function post(url) {
            const r = await fetch(url, { method: 'POST', headers, body: '{}' });
            let j = {};
            try { j = await r.json(); } catch (e) { j = { raw: 'non-json' }; }
            return { http: r.status, json: j };
          }

          (async () => {
            const s = await post(STATUS);
            console.log('STATUS http=' + s.http + ' code=' + s.json.code +
              ' checked_in=' + s.json.checked_in + ' credits=' + s.json.credits +
              ' enable=' + s.json.enable);

            if (s.json.code !== 0) {
              console.log('RESULT auth_failed msg=' + (s.json.message || ''));
              process.exit(1);
            }
            if (s.json.checked_in === true) {
              console.log('RESULT already_checked_in credits=' + s.json.credits);
              return;
            }
            if (s.json.enable === false) {
              console.log('RESULT checkin_disabled');
              process.exit(2);
            }
            const c = await post(CLAIM);
            console.log('CLAIM http=' + c.http + ' code=' + c.json.code +
              ' msg=' + (c.json.message || '') +
              ' credits=' + (c.json.data ? c.json.data.credits : '-'));
            if (c.json.code === 0) {
              console.log('RESULT claimed_ok');
            } else {
              console.log('RESULT claim_failed');
              process.exit(1);
            }
          })();
          JS
          node /tmp/trae_checkin.js | tee -a "$GITHUB_STEP_SUMMARY"
